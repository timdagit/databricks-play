# Lakebase (Postgres) for the parameter store (spec 4.5). The resource types are Beta in
# CLI 1.23, so expect to adjust fields after the first plan.
resources:
  postgres_projects:
    params_project:
      project_id: bakehouse-params-${bundle.target}
      display_name: Bakehouse parameters (${bundle.target})
      pg_version: 16
      # The platform minimum: 2 days of point-in-time history is all it allows.
      history_retention_duration: 172800s
      default_endpoint_settings:
        autoscaling_limit_min_cu: 0.5
        autoscaling_limit_max_cu: 2
        # Scale to zero after 60 seconds idle, the platform minimum (idle_stop_minutes = 1).
        suspend_timeout_duration: 60s
      custom_tags:
        - key: project
          value: bakehouse-poc
        - key: env
          value: ${bundle.target}
        - key: owner
          value: tim
      # dev only: `bundle destroy` removes the project for good instead of soft-deleting it.
      # Make this a variable if test or prod targets are added.
      purge_on_delete: true

  # Declared here, not created by the catalog, so its resource name is fixed
  # (.../databases/bakehouse). The app resource needs that name, and a database that the
  # catalog creates gets a generated one.
  postgres_databases:
    params_database:
      parent: projects/${resources.postgres_projects.params_project.project_id}/branches/production
      database_id: bakehouse
      postgres_database: bakehouse
      # The owner must be an existing role. The platform creates one for whoever creates the
      # project, named after their short user name, so the deploying user owns the database.
      role: projects/${resources.postgres_projects.params_project.project_id}/branches/production/roles/${workspace.current_user.short_name}

  postgres_catalogs:
    params_catalog:
      # Registers the database in Unity Catalog so the ETL can read parameters with Spark SQL.
      catalog_id: ${var.params_catalog}
      branch: projects/${resources.postgres_projects.params_project.project_id}/branches/production
      postgres_database: ${resources.postgres_databases.params_database.postgres_database}
