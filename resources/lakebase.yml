# Lakebase (Postgres) for the parameter store (spec 4.5). The resource types are Beta in
# CLI 1.23, so expect to adjust fields after the first plan.
resources:
  postgres_projects:
    params:
      project_id: bakehouse-params-${bundle.target}
      display_name: Bakehouse parameters (${bundle.target})
      pg_version: 16
      # The platform minimum: 2 days of point-in-time history is all it allows.
      history_retention_duration: 172800s
      default_endpoint_settings:
        autoscaling_limit_min_cu: 0.5
        autoscaling_limit_max_cu: 2
        # Scale to zero after 60 seconds idle, the platform minimum (idle_stop_minutes = 1).
        suspend_timeout_duration: 60s
      custom_tags:
        - key: project
          value: bakehouse-poc
        - key: env
          value: ${bundle.target}
        - key: owner
          value: tim
      # dev only: `bundle destroy` removes the project for good instead of soft-deleting it.
      # Make this a variable if test or prod targets are added.
      purge_on_delete: true

  postgres_catalogs:
    params:
      # Registers the database in Unity Catalog so the ETL can read parameters with Spark SQL.
      catalog_id: bakehouse_params_${bundle.target}
      # Assumes the project's default branch is called `production`; confirm on the first plan.
      branch: projects/${resources.postgres_projects.params.project_id}/branches/production
      postgres_database: bakehouse
      create_database_if_missing: true
