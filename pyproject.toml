[project]
name = "bakehouse-core"
version = "0.1.0"
description = "Reusable logic for the Bakehouse Databricks PoC: parameters, simulator, transforms and data quality."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.1.6",
]

[project.scripts]
bakehouse-simulate = "bakehouse_core.jobs.simulate:main"
bakehouse-reset = "bakehouse_core.jobs.reset:main"
bakehouse-load-params = "bakehouse_core.jobs.load_params:main"
bakehouse-silver-build = "bakehouse_core.jobs.silver_build:main"
bakehouse-gold-build = "bakehouse_core.jobs.gold_build:main"

[dependency-groups]
# The Dash app. A group, not a dependency, so the wheel the jobs install on serverless
# stays small. `uv sync` installs it by default (see `default-groups` below).
app = [
    "dash>=4.5,<5",  # DataTable is deprecated and goes in a later major version
    "databricks-sdk>=0.160.0",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.7",
]
dev = [
    "pyspark>=4.0,<4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.uv]
default-groups = ["dev", "app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bakehouse_core"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Designer files are written only by the canvas (ruff would lint and reformat the notebook JSON).
extend-exclude = ["lakeflow"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Databricks provides dbutils, spark and display; a notebook may fix sys.path before importing.
"notebooks/*.py" = ["F821", "E402", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "spark: needs a Spark session (deselect locally with -m 'not spark')",
    "databricks: needs a Databricks workspace and credentials",
]
