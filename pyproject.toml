[project]
name = "bakehouse-core"
version = "0.1.0"
description = "Reusable logic for the Bakehouse Databricks PoC: parameters, simulator, transforms and data quality."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.1.6",
]

[project.scripts]
bakehouse-simulate = "bakehouse_core.jobs.simulate:main"
bakehouse-reset = "bakehouse_core.jobs.reset:main"
bakehouse-load-params = "bakehouse_core.jobs.load_params:main"

[dependency-groups]
dev = [
    "pyspark>=4.0,<4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bakehouse_core"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "spark: needs a Spark session (deselect locally with -m 'not spark')",
    "databricks: needs a Databricks workspace and credentials",
]
