# The compute bundle: jobs, the app, Lakebase and the Designer tasks. The schemas and volumes it
# uses come from the data bundle (../dab-data), which has to be deployed first.
#
# Dev compute is hand-built in the portal and does not use this bundle. It is the reference the
# hand-built jobs are compared with, and the source for sandbox and above. Run the commands from
# this folder:
#   cd dab-compute
#   databricks bundle validate -t dev -p personal
bundle:
  name: bakehouse

include:
  - resources/*.yml

# Upload the built wheel to a Unity Catalog volume instead of the bundle's workspace folder, so a
# notebook can `%pip install` it from a known place. The volume (dab-data/resources/schemas.yml)
# has to exist before a deploy can use it, which the data bundle takes care of.
workspace:
  artifact_path: /Volumes/${var.catalog}/ops/artifacts

# The package and the app live in the repo root, one level above this bundle, so the build runs
# there (`path: ..`). Paths in `files` are relative to this folder.
artifacts:
  bakehouse_core:
    type: whl
    path: ..
    # Also copies bakehouse_core into the app folder (the app only gets its own folder).
    build: uv build --wheel && uv run --no-project python scripts/stage_app.py
    files:
      - source: ../dist/*.whl

# A bundle only syncs its own folder by default. The app and the Designer files sit outside it,
# so they are listed here, and the sync root becomes the repo root.
sync:
  paths:
    - .
    - ../apps
    - ../lakeflow
  # The staged copy is gitignored, so it has to be named here to be uploaded.
  include:
    - ../apps/param_admin/bakehouse_core/**

variables:
  catalog:
    description: Unity Catalog catalog for this target (created in az-inf).
    default: bakehouse_dev
  idle_stop_minutes:
    description: Idle minutes before anything that bills while running stops. Lakebase minimum is 1 minute.
    default: 1
  job_timeout_seconds:
    description: Run timeout for jobs. Only catches runaways, since a job has no idle state.
    default: 900
  params_catalog:
    description: Unity Catalog name that Lakebase is registered as, where the ETL reads parameters.
    default: bakehouse_params_${bundle.target}
  param_backend:
    description: Where the ETL reads parameters from, `lakebase` (its catalog) or `delta` (ops tables).
    default: lakebase
  job_duration_warning_seconds:
    description: A run longer than this raises a health warning, well before the timeout.
    default: 600

presets:
  tags:
    project: bakehouse-poc
    env: ${bundle.target}
    owner: tim

targets:
  dev:
    # No `mode: development`: it forces a dev_<user>_ prefix on schema names, which
    # the dev-only catalog doesn't need. The presets below keep what matters for cost.
    default: true
    presets:
      trigger_pause_status: PAUSED
