# The parameter admin app on Databricks Apps (spec 4.4). It runs as its own service principal.
# Its start command and env vars are in apps/param_admin/app.yaml, which the platform reads from
# the source folder. This bundle only declares the app and what it may use. Still to settle
# before sandbox: LAKEBASE_ENDPOINT in that file names the dev project, so it needs a value per
# target, and whether the bundle can set it (docs/decisions.md).
# Deploying creates it stopped, so nothing bills until you start it (run from dab-compute/):
#   databricks bundle run param_admin -t dev -p personal
# and stop it again when finished:
#   databricks apps stop bakehouse-param-admin-dev -p personal
resources:
  apps:
    param_admin:
      name: bakehouse-param-admin-${bundle.target}
      description: Edit the Bakehouse business parameters and start ETL runs.
      source_code_path: ../../apps/param_admin
      compute_size: MEDIUM
      lifecycle:
        started: false
      resources:
        - name: lakebase
          postgres:
            # The project and database come from the data bundle, so they are named, not referenced.
            branch: projects/${var.lakebase_project}/branches/production
            database: projects/${var.lakebase_project}/branches/production/databases/bakehouse
            permission: CAN_CONNECT_AND_CREATE
        - name: etl-job
          job:
            id: ${resources.jobs.bakehouse_etl.id}
            permission: CAN_MANAGE_RUN
        - name: daily-run-job
          job:
            id: ${resources.jobs.daily_run.id}
            permission: CAN_MANAGE_RUN
