# How Databricks Apps starts the parameter admin app. The platform reads this file from the
# source folder. The resources it names in `valueFrom` (etl-job, daily-run-job) are added to the
# app in the portal (dev) or in dab-compute/resources/app.yml (sandbox and above).
command: ["gunicorn", "app:server"]

env:
  - name: PARAM_BACKEND
    value: lakebase
  - name: JOB_TRIGGER
    value: databricks
  # The ids of the jobs the app may run, from the app's job resources.
  - name: ETL_JOB_ID
    valueFrom: etl-job
  - name: DAILY_RUN_JOB_ID
    valueFrom: daily-run-job
  # The Lakebase compute to log in to. This is the dev project: its name holds the environment,
  # so it has to be supplied per target when the app is deployed from the bundle.
  - name: LAKEBASE_ENDPOINT
    value: projects/bakehouse-params-dev/branches/production/endpoints/primary
  # Stop the app after this many idle minutes (the Lakebase and platform minimum). It stops
  # itself through the Apps API, which needs CAN_MANAGE on itself (granted once by
  # scripts/grant_app_self_manage.sh). It finds its own name from the platform's
  # DATABRICKS_APP_NAME.
  - name: IDLE_STOP_MINUTES
    value: "1"
