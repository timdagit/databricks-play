# The data bundle: the schemas and volumes that jobs, notebooks and the app read and write.
#
# Unity Catalog objects cannot be exported from the portal into Git, so they are always created
# from a bundle, in every environment including dev. This bundle is kept apart from the compute
# bundle so that rebuilding or destroying jobs and apps never touches the data. The reverse is
# not true: destroying THIS bundle deletes every table in its schemas, including tables it did
# not create.
#
# Deploy this first. Run the commands from this folder:
#   cd dab-data
#   databricks bundle validate -t dev -p personal
#   databricks bundle deploy -t dev -p personal
bundle:
  name: bakehouse-data

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for this target (created in az-inf).
    default: bakehouse_dev

presets:
  tags:
    project: bakehouse-poc
    env: ${bundle.target}
    owner: tim

targets:
  # No `mode: development` on any target: it would prefix schema names (dev_<user>_silver), and
  # an empty `name_prefix` is ignored, so it cannot be switched off. Environments are separated
  # by catalog instead, so the schema names stay the same everywhere.
  dev:
    default: true
